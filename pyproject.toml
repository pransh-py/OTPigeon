[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otpigeon-server"
version = "0.2.0rc1"
description = "A self-hostable, project-scoped verification gateway"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Praanesh"}]
keywords = ["otp", "verification", "whatsapp", "sms", "self-hosted"]
classifiers = ["Development Status :: 4 - Beta", "Framework :: FastAPI", "Programming Language :: Python :: 3", "Topic :: Internet :: WWW/HTTP :: HTTP Servers"]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/pransh-py/OTPigeon"
Issues = "https://github.com/pransh-py/OTPigeon/issues"

[project.scripts]
otpigeon = "otpigeon.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]
include = ["otpigeon*"]

[tool.setuptools.package-data]
otpigeon = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.dynamic]
dependencies = {file = ["backend/requirements.txt"]}

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["backend/otpigeon/**/*.py", "backend/tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
