resolver 127.0.0.11 valid=5s ipv6=off;
upstream otpigeon {
    zone otpigeon 64k;
    server api:8000 resolve max_fails=1 fail_timeout=2s;
    server api-2:8000 resolve max_fails=1 fail_timeout=2s;
}
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;
    access_log off;
    location / {
        proxy_pass http://otpigeon;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Retry only before a request is sent. Clients retry create/resend with the same key.
        proxy_next_upstream error timeout;
    }
}
