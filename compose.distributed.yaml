# Local multi-process demonstration; the single MongoDB node is still a SPOF.
# Run with: docker compose -f compose.yaml -f compose.distributed.yaml up --build -d --wait
services:
  api:
    ports: !reset []
  api-2:
    extends:
      file: compose.yaml
      service: api
    ports: !reset []
  worker-2:
    extends:
      file: compose.yaml
      service: worker
  gateway:
    image: nginx:1.29.6-alpine
    ports: ["127.0.0.1:${OTPIGEON_PORT:-8000}:8080"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: {condition: service_healthy}
      api-2: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
