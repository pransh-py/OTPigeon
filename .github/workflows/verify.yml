name: Verify gateway
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable replica set
        run: |
          docker run -d --name otpigeon-test-mongo -p 127.0.0.1:27017:27017 mongo:8.2.3 --replSet otpigeon_test --bind_ip_all
          for _ in $(seq 1 60); do
            if docker exec otpigeon-test-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'; then break; fi
            sleep 1
          done
          docker exec otpigeon-test-mongo mongosh --quiet --eval "rs.initiate({_id:'otpigeon_test',members:[{_id:0,host:'127.0.0.1:27017'}]}); for(let i=0;i<60;i++){if(db.hello().isWritablePrimary) quit(0); sleep(1000);} quit(1);"
      - name: Backend, races, signed callbacks, process death and operator security
        env:
          OTPIGEON_TEST_MONGODB_URL: mongodb://127.0.0.1:27017/?replicaSet=otpigeon_test
        run: |
          pip install -r backend/requirements-dev.txt
          python -m pytest backend/tests -q
          ruff check backend/otpigeon backend/tests scripts
          ruff format --check backend/otpigeon backend/tests scripts
      - name: Supported distribution audit and build
        run: |
          pip-audit -r backend/requirements.txt
          python -m build
          twine check dist/*
          python -m venv /tmp/otpigeon-install
          /tmp/otpigeon-install/bin/pip install dist/*.whl
          /tmp/otpigeon-install/bin/otpigeon --version
          npm ci --ignore-scripts --prefix sdk
          npm test --prefix sdk
          npm audit --prefix sdk
          mkdir -p .local
          npm pack ./sdk --pack-destination .local
      - name: Experimental sender regression boundary
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --ignore-scripts --prefix whatsapp-sender
          npm test --prefix whatsapp-sender
      - name: Experimental dependency report (outside release artifacts)
        run: npm audit --prefix whatsapp-sender --json > .local/experimental-audit.json || test -s .local/experimental-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: packages-python-${{ matrix.python }}
          path: |
            dist/*
            .local/*.tgz
            .local/experimental-audit.json
      - name: Clean disposable replica set
        if: always()
        run: docker rm -f otpigeon-test-mongo || true
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Start two APIs and two workers
        run: |
          python scripts/init_local.py
          docker compose -f compose.yaml -f compose.distributed.yaml up --build -d --wait
      - name: Full mock flow from installed container
        run: |
          docker compose exec -T api python -c "from otpigeon import __version__; print(__version__)"
          docker compose exec -T api otpigeon --help
          docker compose exec -T api otpigeon prune
          pip install httpx==0.28.1
          python scripts/smoke.py
      - name: Scan release image OS and Python dependencies
        run: |
          mkdir -p .local
          docker save "$(docker compose images -q api)" -o .local/gateway.tar
          docker run --rm -v "$PWD/.local:/scan" aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --input /scan/gateway.tar --format json --output /scan/container-vulns.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-audit
          path: .local/container-vulns.json
      - name: Clean this job's state
        if: always()
        run: docker compose -f compose.yaml -f compose.distributed.yaml down -v
